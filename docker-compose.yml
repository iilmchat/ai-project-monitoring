services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iiruchating}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-iiruchating}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-iiruchating} -d ${POSTGRES_DB:-iiruchating}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: iiruchating-backend:dev
    ports:
      - "8000:8000"
    volumes:
      # Keep non-DB data (exports/backups) on the host.
      - ./data:/app/data
      # Host projects mounted read-write so scan/status/actions work.
      # PROJECTS_ROOT lets Windows/Linux users point at a different host root.
      - ${PROJECTS_ROOT:-C:/Projects}:/projects
      # Read-only Docker socket for container status (DooD, S24-002).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-iiruchating}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-iiruchating}
      SCAN_ROOTS: ${SCAN_ROOTS:-/projects}
      SCAN_DEPTH: ${SCAN_DEPTH:-3}
      DEBUG: ${DEBUG:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITFLIC_TOKEN: ${GITFLIC_TOKEN:-}
      FETCH_TIMEOUT: ${FETCH_TIMEOUT:-30}
      DOCKER_ENABLED: ${DOCKER_ENABLED:-true}
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
      DOCKER_PATH_MAP: ${DOCKER_PATH_MAP:-C:/Projects=/projects}
      DOCKER_STATUS_TTL_SECONDS: ${DOCKER_STATUS_TTL_SECONDS:-30}
      DOCKER_TIMEOUT_SECONDS: ${DOCKER_TIMEOUT_SECONDS:-3}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://127.0.0.1:1234/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_ALLOW_REMOTE: ${EMBEDDING_ALLOW_REMOTE:-false}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      RAG_MAX_FILE_BYTES: ${RAG_MAX_FILE_BYTES:-524288}
      RAG_MAX_CHUNKS_PER_REPO: ${RAG_MAX_CHUNKS_PER_REPO:-2000}
      RAG_CHUNK_CHARS: ${RAG_CHUNK_CHARS:-1000}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-150}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-604800}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-5}
      AUTH_LOGIN_RATE_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_WINDOW_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: iiruchating-frontend:dev
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
