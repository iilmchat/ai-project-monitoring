[project]
name = "iiruchating-backend"
version = "1.4.1"
description = "ai-project-monitoring backend (FastAPI)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["pygit2", "pygit2.*", "docker", "docker.*", "sqlite_vec", "sqlite_vec.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: integration tests requiring PostgreSQL + pgvector (TEST_DATABASE_URL)",
]
